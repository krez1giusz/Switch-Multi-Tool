[project]
name = "switchmultitool"
version = "0.4.0.dev0"
description = "Serial console toolkit prototype for network switches"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "openpyxl>=3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
