[ui]
terminal_max_chars = 180000

[serial]
default_baud = 9600
flow_profiles = none,xonxoff,rtscts,raw-win-fallback,raw-win-only
log_dir = logs

[paths]
results_csv = results/check_results.csv
order_excel_backup_dir = backups/order_excel

[detector]
boot_max_timeout = 360
boot_idle_timeout = 55
nudge_timeout = 35
prompt_timeout = 75
enable_timeout = 15
config_mode_timeout = 12

[set_test_password]
enable_secret = Test123!
prompt_timeout = 45
enable_timeout = 12
config_timeout = 10
end_timeout = 8
write_memory_timeout = 15
disable_timeout = 6

[recovery]
total_steps = 5
switch_prompt_timeout = 300
flash_init_timeout = 60
load_helper_timeout = 15
dir_flash_timeout = 20
delete_timeout = 15
boot_max_timeout = 360
boot_idle_timeout = 65
post_boot_nudge_timeout = 35
user_prompt_timeout = 40
priv_prompt_timeout = 10

# Format: filename|required albo filename|optional.
# Recovery Wizard kasuje te pliki w ROMMON przez: delete flash:<filename>
delete_files =
    config.text|required
    vlan.dat|optional
    private-config.text|optional
    config.old|optional

[adapter:0x1A86:0x7523]
name = WCH CH340 / CH341
recommended_flow = raw-win-only

[adapter:0x0403:0x6001]
name = FTDI FT232
recommended_flow = none

[adapter:0x067B:0x2303]
name = Prolific PL2303
recommended_flow = none

[recovery_instruction:WS-C2960C]
text =
    Instrukcja dla Cisco Catalyst 2960-C / WS-C2960C
    1. Odepnij zasilanie switcha.
    2. Wcisnij i trzymaj przycisk MODE.
    3. Podepnij zasilanie, caly czas trzymajac MODE.
    4. Pusc MODE dopiero gdy dioda SYST mignie pomaranczowo dwa razy.
    5. Po chwili dioda SYST powinna swiecic stalym zielonym.
    Aplikacja nasluchuje promptu switch: i przejdzie dalej automatycznie.

[recovery_instruction:default]
text =
    Instrukcja ogolna, model nie zostal jeszcze odczytany
    1. Wylacz zasilanie switcha.
    2. Wcisnij i trzymaj przycisk MODE.
    3. Wlacz zasilanie, caly czas trzymajac MODE.
    4. Pusc MODE dopiero gdy switch wejdzie w tryb recovery/boot loader.
    Aplikacja nasluchuje promptu switch: i przejdzie dalej automatycznie.

[command_profile:Cisco IOS generic]
terminal_length_command = terminal length 0
read_info_commands =
    show version

[command_profile:Cisco Catalyst 2960 / 2960-C]
terminal_length_command = terminal length 0
read_info_commands =
    show version

[command_profile:Cisco Catalyst 2960X]
terminal_length_command = terminal length 0
read_info_commands =
    show version
